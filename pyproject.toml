[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decider-lab"
version = "0.1.0"
description = "Evaluate, calibrate, compare and fine-tune decision models: Strands Decider and anything behind an adapter, locally or on a rented GPU."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Vivek Raja" }]
keywords = ["strands-decider", "evaluation", "calibration", "fine-tuning", "jevbench", "llm"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# the model itself, to serve or fine-tune on this machine (image input needs GitHub main)
strands = ["strands-decider[vision] @ git+https://github.com/strands-labs/strands-decider@3e94e9d84c620ed5a95f1a3310c3decb971e261c"]
hub = ["huggingface_hub>=0.23"]
heldout = ["datasets>=2.19", "huggingface_hub>=0.23", "pyarrow>=14"]
chess = ["chess>=1.10"]
vast = ["vastai"]
aws = ["boto3>=1.34"]
bedrock = ["boto3>=1.34"]
strands-agents = ["strands-agents>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
decider-lab = "decider_lab.cli:main"

[project.urls]
Homepage = "https://github.com/Vivek0712/decider-lab"
"Strands Decider" = "https://github.com/strands-labs/strands-decider"

[tool.hatch.build.targets.wheel]
packages = ["src/decider_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
