<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2FDC85"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07150F"/><stop offset="1" stop-color="#0E3322"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <text x="40" y="54" font-size="24" font-weight="800" fill="#F2F6F3">Run anywhere, with one flag</text>
  <text x="40" y="82" font-size="15" fill="#BFD3C8">compute.backend in lab.yaml, or  decider-lab run lab.yaml --on local | ssh | aws | vast</text>

  <!-- four backends -->
  <g font-size="14">
    <g transform="translate(40,112)">
      <rect width="260" height="150" rx="16" fill="#0A1A12" stroke="#2FDC85" stroke-opacity="0.5" stroke-width="2"/>
      <text x="20" y="38" font-size="20" font-weight="800" fill="#2FDC85">local</text>
      <text x="20" y="66" fill="#DCE8E1">this machine</text>
      <text x="20" y="92" fill="#7FA392">GPU, Apple MPS, or CPU</text>
      <text x="20" y="118" fill="#7FA392">nothing to create</text>
    </g>
    <g transform="translate(320,112)">
      <rect width="260" height="150" rx="16" fill="#0A1A12" stroke="#2FDC85" stroke-opacity="0.5" stroke-width="2"/>
      <text x="20" y="38" font-size="20" font-weight="800" fill="#2FDC85">ssh</text>
      <text x="20" y="66" fill="#DCE8E1">a machine you already have</text>
      <text x="20" y="92" fill="#7FA392">workstation, on-prem, your EC2</text>
      <text x="20" y="118" fill="#7FA392">left as it was afterwards</text>
    </g>
    <g transform="translate(600,112)">
      <rect width="260" height="150" rx="16" fill="#0A1A12" stroke="#2FDC85" stroke-opacity="0.5" stroke-width="2"/>
      <text x="20" y="38" font-size="20" font-weight="800" fill="#2FDC85">aws</text>
      <text x="20" y="66" fill="#DCE8E1">EC2 launched for the run</text>
      <text x="20" y="92" fill="#7FA392">ssh from your IP only; quota checked</text>
      <text x="20" y="118" fill="#7FA392">self-terminates at the deadline</text>
    </g>
    <g transform="translate(880,112)">
      <rect width="280" height="150" rx="16" fill="#0A1A12" stroke="#2FDC85" stroke-opacity="0.5" stroke-width="2"/>
      <text x="20" y="38" font-size="20" font-weight="800" fill="#2FDC85">vast</text>
      <text x="20" y="66" fill="#DCE8E1">a rented GPU</text>
      <text x="20" y="92" fill="#7FA392">cheapest offer under your price cap</text>
      <text x="20" y="118" fill="#7FA392">destroyed with -y, then verified</text>
    </g>
  </g>

  <!-- shared flow -->
  <text x="40" y="312" font-size="13" font-weight="700" fill="#2FDC85" letter-spacing="2">ONE FLOW FOR EVERY REMOTE BACKEND</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <g fill="#F2F6F3">
      <rect x="40" y="330" width="140" height="56" rx="28" fill="#2FDC85"/><text x="110" y="364" fill="#06140E">check</text>
      <rect x="208" y="330" width="140" height="56" rx="28" fill="none" stroke="#2FDC85" stroke-width="2"/><text x="278" y="364">acquire</text>
      <rect x="376" y="330" width="140" height="56" rx="28" fill="none" stroke="#2FDC85" stroke-width="2"/><text x="446" y="364">copy</text>
      <rect x="544" y="330" width="140" height="56" rx="28" fill="none" stroke="#2FDC85" stroke-width="2"/><text x="614" y="364">bootstrap</text>
      <rect x="712" y="330" width="140" height="56" rx="28" fill="none" stroke="#2FDC85" stroke-width="2"/><text x="782" y="364">run + stream</text>
      <rect x="880" y="330" width="120" height="56" rx="28" fill="none" stroke="#2FDC85" stroke-width="2"/><text x="940" y="364">fetch</text>
      <rect x="1028" y="330" width="132" height="56" rx="28" fill="#2FDC85"/><text x="1094" y="364" fill="#06140E">release</text>
    </g>
    <g stroke="#2FDC85" stroke-width="2" marker-end="url(#a)">
      <path d="M180 358H204"/><path d="M348 358H372"/><path d="M516 358H540"/><path d="M684 358H708"/><path d="M852 358H876"/><path d="M1000 358H1024"/>
    </g>
  </g>
  <g font-size="12.5" fill="#BFD3C8">
    <text x="40" y="416">credit, quota,</text><text x="40" y="433">credentials, host</text>
    <text x="208" y="416">rent / launch /</text><text x="208" y="433">connect</text>
    <text x="376" y="416">code + lab dir,</text><text x="376" y="433">never credentials</text>
    <text x="544" y="416">gcc; torch for this</text><text x="544" y="433">driver (or CPU), pinned</text>
    <text x="712" y="416">detached; hard</text><text x="712" y="433">max_hours deadline</text>
    <text x="880" y="416">runs/ and</text><text x="880" y="433">remote logs</text>
    <text x="1028" y="416">on success, failure,</text><text x="1028" y="433">deadline, Ctrl-C</text>
  </g>
  <text x="40" y="488" font-size="13" fill="#7FA392">Verified: vast.ai A100 (full lab in 537 s) · AWS EC2 c7i.2xlarge (CPU) · laptop. Instances released every time, including on failure.</text>
</svg>
