<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B7A45"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#F5F8F4"/>
  <text x="40" y="52" font-size="24" font-weight="800" fill="#14211A">Fine-tune your own decider</text>
  <text x="40" y="80" font-size="15" fill="#4A5A50">From a CSV of your decisions to a calibrated checkpoint, compared row by row with the model you started from.</text>

  <g filter="url(#s)" font-size="14">
    <g transform="translate(40,120)"><rect width="190" height="150" rx="16" fill="#fff"/>
      <text x="18" y="34" font-size="13" font-weight="800" fill="#0B7A45" letter-spacing="1">1 · DATA</text>
      <text x="18" y="64" font-weight="700" fill="#14211A">your CSV</text><text x="18" y="86" fill="#4A5A50">data from-csv</text>
      <text x="18" y="114" font-weight="700" fill="#14211A">or generated</text><text x="18" y="136" fill="#4A5A50">data generate</text></g>
    <g transform="translate(266,120)"><rect width="190" height="150" rx="16" fill="#fff"/>
      <text x="18" y="34" font-size="13" font-weight="800" fill="#0B7A45" letter-spacing="1">2 · LEAK CHECK</text>
      <text x="18" y="64" font-weight="700" fill="#14211A">no training input</text><text x="18" y="86" fill="#4A5A50">in any eval suite</text>
      <text x="18" y="114" fill="#4A5A50">data leakcheck</text><text x="18" y="136" fill="#4A5A50">exits 1 on overlap</text></g>
    <g transform="translate(492,120)"><rect width="190" height="150" rx="16" fill="#14211A"/>
      <text x="18" y="34" font-size="13" font-weight="800" fill="#2FDC85" letter-spacing="1">3 · TRAIN</text>
      <text x="18" y="64" font-weight="700" fill="#F2F6F3">strands-decider train</text><text x="18" y="86" fill="#BFD3C8">released 2B recipe</text>
      <text x="18" y="114" fill="#BFD3C8">continue_from v19</text><text x="18" y="136" fill="#BFD3C8">(or init_from, warned)</text></g>
    <g transform="translate(718,120)"><rect width="190" height="150" rx="16" fill="#fff"/>
      <text x="18" y="34" font-size="13" font-weight="800" fill="#0B7A45" letter-spacing="1">4 · CALIBRATE</text>
      <text x="18" y="64" font-weight="700" fill="#14211A">temperatures</text><text x="18" y="86" fill="#4A5A50">written into the</text>
      <text x="18" y="108" fill="#4A5A50">checkpoint, on</text><text x="18" y="130" fill="#4A5A50">held-out rows</text></g>
    <g transform="translate(944,120)"><rect width="216" height="150" rx="16" fill="#fff" stroke="#2FDC85" stroke-width="3"/>
      <text x="18" y="34" font-size="13" font-weight="800" fill="#0B7A45" letter-spacing="1">5 · COMPARE</text>
      <text x="18" y="64" font-weight="700" fill="#14211A">served, evaluated,</text><text x="18" y="86" fill="#14211A" font-weight="700">paired vs the base</text>
      <text x="18" y="114" fill="#4A5A50">delta with a 95% CI</text><text x="18" y="136" fill="#4A5A50">per suite and family</text></g>
  </g>
  <g stroke="#0B7A45" stroke-width="3" marker-end="url(#a)"><path d="M232 195H262"/><path d="M458 195H488"/><path d="M684 195H714"/><path d="M910 195H940"/></g>
  <path d="M1052 274 C 1052 340, 135 340, 135 278" fill="none" stroke="#0B7A45" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="600" y="306" text-anchor="middle" font-size="14" fill="#0B7A45" font-weight="700">iterate: more data, another family, another seed</text>
  <rect x="40" y="356" width="1120" height="48" rx="12" fill="#E3F5EA"/>
  <text x="60" y="386" font-size="15" fill="#14211A"><tspan font-weight="800">Verified on one A100:</tspan> 3,591 generated rows, 150 steps from v19: <tspan font-weight="800">+23.4 Intelligence vs v19 (95% CI 18.2 to 28.7)</tspan> on held-out rows of the same families.</text>
</svg>
