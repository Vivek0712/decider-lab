# Fine-tune Strands Decider v19 on your own rows, then compare it with v19 on held-out rows.
#
# 1. training data (here: generated rows; yours via `decider-lab data from-csv`):
#      decider-lab data generate --out data/train.jsonl --per-kind 400 --seed 7 --exclude-suite synthetic:per_kind=100
#      decider-lab data leakcheck data/train.jsonl --against synthetic:per_kind=100
# 2. run (needs a CUDA GPU here, or set compute.on below / pass --on aws|vast|ssh):
#      decider-lab run lab.yaml
name: finetune-lab
workers: 8

finetune:
  mine:
    from: hf://StrandsAgents/strands-decider-2B-hobson-v19@bb282d786bc251fd4e3068de3ada9ddbb38127cd
    train: data/train.jsonl
    steps: 150            # a short run; remove for one full epoch
    micro_batch_size: 8
    grad_accum: 2
    calibrate_on: data/calib.jsonl   # temperatures written into the checkpoint (strands-decider calibrate)

models:
  v19:
    serve: hf://StrandsAgents/strands-decider-2B-hobson-v19@bb282d786bc251fd4e3068de3ada9ddbb38127cd
  # `mine` is added automatically: trained first, then served from its checkpoint
  majority: {baseline: majority}

suites:
  - synthetic: {per_kind: 100}

calibrate: true
baseline: v19

# Where to run: local (default), or a machine with a GPU. See docs/compute.md.
compute:
  backend: local
  max_hours: 2
  # ssh:  {host: ubuntu@my-gpu-box, key: ~/.ssh/id_ed25519}
  # aws:  {instance_type: g6e.xlarge, region: us-east-1, profile: default}
  # vast: {gpu: A100_SXM4, max_price: 0.8, ssh_key: ~/.ssh/id_ed25519}
