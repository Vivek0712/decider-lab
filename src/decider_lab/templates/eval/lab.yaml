# A lab: which models answer which suites, and what to compare them with.
# Run it:            decider-lab run lab.yaml
# Elsewhere:         decider-lab run lab.yaml --on ssh|aws|vast   (see `compute:` below)
name: first-lab
workers: 8

models:
  # Strands Decider v19 (official release), started and stopped for you.
  # Needs strands-decider installed here (pip install 'decider-lab[strands]') and a GPU or Apple MPS.
  v19:
    serve: StrandsAgents/strands-decider-2B-hobson-v19
    model_name: strands-decider-2B-hobson-v19
  # Any running System One server works the same way:
  # remote: {url: "http://127.0.0.1:8000"}
  # Your own code (see my_model.py):
  heuristic: {python: "my_model:Heuristic"}
  # The constant-answer floor every model must beat:
  majority: {baseline: majority}

suites:
  - smoke                          # 90 generated rows, seconds
  - synthetic: {per_kind: 100}     # 900 generated rows with dev/test splits
  # - heldout                      # public held-out families (pip install 'decider-lab[heldout]')
  # - file: data/my_eval.jsonl     # your own rows (decider-lab data from-csv ...)

calibrate: true      # per-kind temperature fitted on dev, scored on test (adds <suite>+cal runs)
baseline: majority   # every model is compared with this one, row by row
# jevbench: [v19]    # also run JevBench's 231 public tasks (local v1.5-rule proxy)

# Where to run: local (default), or a machine with a GPU. See docs/compute.md.
compute:
  on: local
  max_hours: 2
  # ssh:  {host: ubuntu@my-gpu-box, key: ~/.ssh/id_ed25519}
  # aws:  {instance_type: g6e.xlarge, region: us-east-1, profile: default}
  # vast: {gpu: A100_SXM4, max_price: 0.8, ssh_key: ~/.ssh/id_ed25519}
